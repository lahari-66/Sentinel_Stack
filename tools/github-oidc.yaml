AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SentinelStack CI/CD: GitHub Actions OIDC provider and a deploy role that can only assume the
  CDK bootstrap roles. No long-lived keys. Deploy once, in the platform region.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repo (case-sensitive).
  RepoName:
    Type: String
    Default: sentinelstack
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if token.actions.githubusercontent.com already exists in this account.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sentinelstack-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${RepoName}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOwner}/${RepoName}:environment:dev"
                  - !Sub "repo:${GitHubOwner}/${RepoName}:environment:prod"
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-*"

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repo variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
